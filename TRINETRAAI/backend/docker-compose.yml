version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trinetra-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=TRINETRA AI
      - APP_ENV=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:///./trinetra.db
      - DEMO_MODE=true
      - SENTINEL_CATALOGUE_URL=https://cctv.corp8.cloud/cameras.json
      - CORS_ORIGINS=["*"]
    volumes:
      - trinetra-data:/app/uploads
      - trinetra-db:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  trinetra-data:
  trinetra-db:
