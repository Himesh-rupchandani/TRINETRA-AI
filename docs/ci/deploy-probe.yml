name: Deploy probe (prod backend)

# Answers one question on every merge to main: did the PRODUCTION alias pick up
# the new backend, or is it still serving an old deployment / a frontend-only
# project? The Command Center reads "Camera Network 30/31" when the backend is
# live, so this job is the fastest way to tell a stale alias from a broken boot.
#
# It is also the remote half of `scripts/verify/verify_deploy.mjs`: useful when
# you only have GitHub access (no shell, no Vercel dashboard) — run it from the
# Actions tab and read the job summary.

on:
  workflow_dispatch:
    inputs:
      strict:
        description: Fail the job when an origin is not OK
        type: boolean
        default: false
      urls:
        description: Space or comma separated URLs to probe (defaults to prod + kmhx aliases)
        type: string
        required: false
  push:
    branches:
      - main
      - 'arena/**'
  schedule:
    # Runs from the default branch only, so this is inert until merged to main.
    - cron: '0 4 * * *'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Probe production + preview backends
        id: probe
        continue-on-error: true
        env:
          VERIFY_URLS: ${{ inputs.urls }}
        run: |
          set -o pipefail
          node scripts/verify/verify_deploy.mjs | tee /tmp/deploy-probe.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy probe — \`${{ github.ref_name }}\`"
            echo
            echo '```'
            cat /tmp/deploy-probe.txt 2>/dev/null || echo 'verifier produced no output'
            echo '```'
            echo
            echo "Verdicts: \`OK\` backend live · \`NO_BACKEND\` project Root Directory is \`trinetra-ai\`, so \`/api/*\` is the SPA fallback · \`STALE_DEPLOYMENT\` health has no \`demo_data\` (build older than the atomic-seed fix) · \`EMPTY_REGISTRY\` seed rolled back · \`PROTECTED\` Vercel SSO wall."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when strict
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.strict && steps.probe.outcome == 'failure' }}
        run: |
          echo "Deploy probe reported a problem — see the job summary."
          exit 1
