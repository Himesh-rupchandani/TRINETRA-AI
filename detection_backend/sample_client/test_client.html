<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRINETRA AI — External UI Integration Test</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }
    h1 { margin-top: 0; font-size: 24px; }
    p { color: var(--muted); font-size: 14px; }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input[type="file"], select, input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 14px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
    }
    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .progress-box {
      margin-top: 16px;
      display: none;
    }
    .progress-bar {
      height: 8px;
      background: #334155;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      transition: width 0.3s;
    }
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }
    .result-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-col;
    }
    .result-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background: #000;
    }
    .result-card .plate-img {
      height: 48px;
      object-fit: contain;
      background: #111;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .result-info {
      padding: 12px;
    }
    .plate-badge {
      display: inline-block;
      font-family: monospace;
      font-size: 16px;
      font-weight: bold;
      background: #000;
      border: 2px solid #eab308;
      color: #fef08a;
      padding: 4px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .status-text {
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚗 TRINETRA AI — Standalone Detection Client</h1>
    <p>This test page demonstrates how ANY other UI (React, Vue, mobile, or legacy web app) can integrate with the standalone detection backend API via simple HTTP fetch requests.</p>

    <div class="card">
      <div class="form-group">
        <label>1. Detection Server URL:</label>
        <input type="text" id="serverUrl" value="http://localhost:8010">
      </div>

      <div class="form-group">
        <label>2. Select Video Footage (Upload File or Pick Sample):</label>
        <input type="file" id="videoFileInput" accept="video/*">
      </div>

      <div class="form-group">
        <label>Or select footage already on server:</label>
        <select id="serverVideoSelect">
          <option value="">-- Load videos from server --</option>
        </select>
      </div>

      <div class="form-group">
        <label>3. Speed Mode:</label>
        <select id="speedMode">
          <option value="15.0" selected>⚡ Turbo Mode (First 15s) — Fast ~10-15s Results</option>
          <option value="30.0">⚡ Accelerated (First 30s)</option>
          <option value="0.0">🎯 Full Video Analysis</option>
        </select>
      </div>

      <button id="uploadBtn" class="btn">⚡ Start Video Detection</button>

      <div id="progressBox" class="progress-box">
        <div style="display: flex; justify-content: space-between; font-size: 13px;">
          <span id="stageLabel">Uploading video…</span>
          <span id="pctLabel">0%</span>
        </div>
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <div style="font-size: 12px; color: #94a3b8; margin-top: 6px;" id="statsLabel"></div>
      </div>
    </div>

    <div id="resultsSection" style="display: none;">
      <h2>Detection &amp; ANPR Results</h2>
      <p id="summaryText"></p>
      <div id="resultsGrid" class="results-grid"></div>
    </div>
  </div>

  <script>
    const serverUrlInput = document.getElementById('serverUrl');
    const videoFileInput = document.getElementById('videoFileInput');
    const serverVideoSelect = document.getElementById('serverVideoSelect');
    const speedModeSelect = document.getElementById('speedMode');
    const uploadBtn = document.getElementById('uploadBtn');
    const progressBox = document.getElementById('progressBox');
    const stageLabel = document.getElementById('stageLabel');
    const pctLabel = document.getElementById('pctLabel');
    const progressFill = document.getElementById('progressFill');
    const statsLabel = document.getElementById('statsLabel');
    const resultsSection = document.getElementById('resultsSection');
    const resultsGrid = document.getElementById('resultsGrid');
    const summaryText = document.getElementById('summaryText');

    // Populate server videos list on load
    async function loadServerVideos() {
      const server = serverUrlInput.value.trim().replace(/\/$/, '');
      try {
        const res = await fetch(`${server}/api/v1/videos`);
        const data = await res.json();
        serverVideoSelect.innerHTML = '<option value="">-- Choose available server footage --</option>';
        (data.videos || []).forEach(v => {
          const opt = document.createElement('option');
          opt.value = v.filename;
          opt.textContent = `${v.filename} (${v.size_mb} MB)`;
          serverVideoSelect.appendChild(opt);
        });
      } catch (err) {
        console.warn('Could not load server videos:', err);
      }
    }
    loadServerVideos();

    uploadBtn.addEventListener('click', async () => {
      const server = serverUrlInput.value.trim().replace(/\/$/, '');
      const file = videoFileInput.files[0];
      const selectedServerVideo = serverVideoSelect.value;
      const sampleSec = speedModeSelect.value;

      if (!file && !selectedServerVideo) {
        alert('Please select a video file or pick one from the server dropdown.');
        return;
      }

      uploadBtn.disabled = true;
      progressBox.style.display = 'block';
      resultsSection.style.display = 'none';
      resultsGrid.innerHTML = '';
      stageLabel.textContent = file ? 'Uploading video to backend…' : 'Queuing detection on server footage…';
      pctLabel.textContent = '10%';
      progressFill.style.width = '10%';

      const formData = new FormData();
      if (file) {
        formData.append('file', file);
      } else {
        formData.append('video_path', selectedServerVideo);
      }
      formData.append('sample_seconds', sampleSec);
      formData.append('target_fps', '5.0');

      try {
        const uploadRes = await fetch(`${server}/api/v1/detect/video`, {
          method: 'POST',
          body: formData,
        });
        if (!uploadRes.ok) throw new Error(`Upload failed with status ${uploadRes.status}`);
        const job = await uploadRes.json();
        const jobId = job.job_id;

        // Poll job status
        pollJob(server, jobId);
      } catch (err) {
        alert(`Error starting detection: ${err.message}`);
        uploadBtn.disabled = false;
        progressBox.style.display = 'none';
      }
    });

    async function pollJob(server, jobId) {
      try {
        const res = await fetch(`${server}/api/v1/detect/jobs/${jobId}`);
        const data = await res.json();

        const pct = Math.round(data.progress_pct || 0);
        pctLabel.textContent = `${pct}%`;
        progressFill.style.width = `${Math.max(15, pct)}%`;
        stageLabel.textContent = `Stage: ${data.stage || data.status}`;
        statsLabel.textContent = `Vehicles Detected: ${data.vehicles_detected || 0} | OCR Reads: ${data.ocr_reads || 0} | Elapsed: ${data.elapsed_time_sec || 0}s`;

        if (data.status === 'COMPLETED') {
          uploadBtn.disabled = false;
          stageLabel.textContent = 'Completed! Loading results…';
          displayResults(server, jobId);
        } else if (data.status === 'FAILED') {
          uploadBtn.disabled = false;
          alert(`Detection failed: ${data.error_message || 'Unknown error'}`);
        } else {
          setTimeout(() => pollJob(server, jobId), 800);
        }
      } catch (e) {
        setTimeout(() => pollJob(server, jobId), 1500);
      }
    }

    async function displayResults(server, jobId) {
      try {
        const res = await fetch(`${server}/api/v1/detect/jobs/${jobId}/results`);
        const data = await res.json();
        const sightings = data.sightings || [];

        resultsSection.style.display = 'block';
        summaryText.textContent = `Found ${sightings.length} vehicle sightings (${data.unique_plates || 0} unique license plates) in ${data.filename}.`;

        resultsGrid.innerHTML = '';
        sightings.forEach(s => {
          const card = document.createElement('div');
          card.className = 'result-card';

          const vImg = s.evidence_urls.vehicle_image ? `${server}${s.evidence_urls.vehicle_image}` : 'https://placehold.co/300x200?text=No+Vehicle+Crop';
          const pImg = s.evidence_urls.plate_image ? `<img class="plate-img" src="${server}${s.evidence_urls.plate_image}" alt="Plate Crop">` : '';

          card.innerHTML = `
            <img src="${vImg}" alt="Vehicle Crop">
            ${pImg}
            <div class="result-info">
              <div class="plate-badge">${s.plate_number}</div>
              <div style="font-weight: 600; text-transform: uppercase; font-size: 13px;">${s.vehicle_class} · Track #${s.track_id}</div>
              <div class="status-text">Confidence: ${Math.round(s.plate_confidence * 100)}% | Time: ${s.start_time} (${s.duration_sec}s)</div>
            </div>
          `;
          resultsGrid.appendChild(card);
        });
      } catch (err) {
        console.error('Error fetching results:', err);
      }
    }
  </script>
</body>
</html>
